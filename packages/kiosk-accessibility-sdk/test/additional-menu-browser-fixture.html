<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>SDK additional-menu browser fixtures</title>
  <link rel="stylesheet" href="/packages/kiosk-accessibility-sdk/dist/styles.css">
  <style>
    * { box-sizing: border-box; }
    html, body { margin: 0; min-height: 100%; font: 16px/1.4 sans-serif; }
    body { padding-bottom: 0; }
    #fixture-root { position: relative; width: 100%; min-height: 100vh; }
    #fixture-result { position: fixed; left: -10000px; top: 0; }
    .fixture-header { height: 104px; padding: 12px; }
    .fixture-scroll { height: 560px; overflow-y: auto; padding-bottom: 96px; }
    .fixture-list { display: grid; gap: 8px; }
    .menu-item { display: block; width: 100%; min-height: 82px; border: 1px solid #777; background: white; }
    .fixture-footer { position: fixed; z-index: 6; right: 0; bottom: 0; left: 0; height: 104px; padding: 20px; background: #ddd; }
    .fixture-qr-dock { position: fixed; z-index: 10; right: 0; bottom: 104px; left: 0; height: 72px; background: #eee; }
    #fixture-root.document-scroll .fixture-scroll { height: auto; overflow: visible; padding-bottom: 0; }
    #fixture-root.document-scroll .menu-item { min-height: 160px; }
    #fixture-root.document-scroll .menu-item:nth-child(9) { margin-top: 130px; }
    #fixture-root.document-scroll .fixture-list { padding-bottom: 100px; }
    #fixture-root.fit .fixture-scroll { height: 500px; }
    #fixture-root.fit .menu-item { min-height: 48px; }
    #fixture-root.fit.a11y-text-extra .menu-item { min-height: 160px; }
    #fixture-root.unreachable { position: fixed; top: 0; left: 0; width: 100%; height: 320px; min-height: 0; overflow: hidden; }
    #fixture-root.unreachable .fixture-scroll { height: 230px; overflow: hidden; }
    #fixture-root.unreachable .fixture-footer { height: 60px; }
  </style>
</head>
<body>
  <div id="fixture-root"></div>
  <pre id="fixture-result">pending</pre>
  <script type="module">
    import { analyzeAdditionalMenuOverflow, createAccessibilitySdk, DEFAULT_ACCESSIBILITY_PROFILE } from "/packages/kiosk-accessibility-sdk/dist/index.js";
    const root = document.querySelector("#fixture-root");
    const result = {};
    const wait = () => new Promise((resolve) => setTimeout(resolve, 100));
    function mount(kind, count, message) {
      document.querySelector("[data-a11y-qr-entry-dock]")?.remove();
      root.replaceChildren();
      root.className = `kiosk ${kind}`;
      const header = document.createElement("header");
      header.className = "fixture-header";
      header.textContent = "메뉴 영역";
      const scroll = document.createElement("div");
      scroll.className = "fixture-scroll";
      const list = document.createElement("div");
      list.className = "fixture-list";
      for (let index = 0; index < count; index += 1) {
        const button = document.createElement("button");
        button.className = "menu-item";
        button.textContent = `메뉴 ${index + 1}`;
        button.dataset.index = String(index);
        button.addEventListener("click", () => { button.dataset.clicked = "true"; });
        list.append(button);
      }
      scroll.append(list);
      const footer = document.createElement("footer");
      footer.className = "fixture-footer";
      footer.dataset.a11ySlot = "bottom-controls";
      footer.textContent = "하단 조작부";
      const dock = document.createElement("aside");
      dock.dataset.a11yQrEntryDock = "true";
      dock.className = "fixture-qr-dock";
      dock.textContent = "SDK QR 도크";
      root.append(header, scroll, footer);
      document.body.append(dock);
      const adapter = {
        getSnapshot: () => ({ screenId: `fixture.${kind}` }),
        getActions: () => [...root.querySelectorAll(".menu-item")].map((element, index) => ({
          id: `menu.${index}`, name: element.textContent, element, enabled: true,
        })),
        getTextTargets: () => [],
        getLayoutRegions: () => ({
          scrollArea: scroll,
          bottomControls: [footer],
          guidanceAvoidAreas: [dock],
          menuItems: [...root.querySelectorAll(".menu-item")],
          ...(message ? { menuMessage: message } : {}),
        }),
      };
      return { scroll, footer, dock, sdk: createAccessibilitySdk({ root, adapter }), adapter };
    }
    async function hintVisible() { await wait(); return Boolean(root.querySelector(".a11y-additional-menu-hint") && getComputedStyle(root.querySelector(".a11y-additional-menu-hint")).visibility !== "hidden"); }
    async function checkScrollable(kind, count) {
      const instance = mount(kind, count, "호스트 문구는 공통 문구로 대체되어야 합니다.");
      const startsVisible = await hintVisible();
      const standardCopy = root.querySelector(".a11y-additional-menu-copy")?.textContent === "아래에도 내용이 있어요";
      instance.sdk.applyProfile({ ...DEFAULT_ACCESSIBILITY_PROFILE, textSize: "extraLarge", buttonSize: "large", contrast: "high" });
      await wait();
      const testItem = root.querySelector(".menu-item");
      let contentStyleMutations = 0;
      const contentObserver = new MutationObserver((records) => { contentStyleMutations += records.length; });
      contentObserver.observe(testItem, { attributes: true, attributeFilter: ["style"] });
      const noSafeSpaceAtStart = root.dataset.a11yScrollGuidance === "no-safe-space";
      const hint = root.querySelector(".a11y-additional-menu-hint");
      const hintRect = hint?.getBoundingClientRect();
      const hintPointerEventsNone = !hint || getComputedStyle(hint).pointerEvents === "none";
      const last = root.querySelector(".menu-item:last-child");
      const initialNoOverlap = !hint || Boolean(hintRect && [instance.footer, instance.dock].every((obstacle) => {
        const r = obstacle.getBoundingClientRect();
        return !(hintRect.left < r.right && hintRect.right > r.left && hintRect.top < r.bottom && hintRect.bottom > r.top);
      }));
      if (kind === "document-scroll") window.scrollTo(0, document.documentElement.scrollHeight);
      else instance.scroll.scrollTop = instance.scroll.scrollHeight;
      (kind === "document-scroll" ? window : instance.scroll).dispatchEvent(new Event("scroll", { bubbles: true }));
      const scrollOwner = kind === "document-scroll" ? document.scrollingElement : instance.scroll;
      const positionAtEnd = scrollOwner.scrollTop;
      const heightAtEnd = scrollOwner.scrollHeight;
      const endSamples = [];
      for (const delay of [100, 500, 1000]) {
        await new Promise((resolve) => setTimeout(resolve, delay));
        endSamples.push({ top: scrollOwner.scrollTop, height: scrollOwner.scrollHeight });
      }
      const scrollStable = endSamples.every((sample) =>
        Math.abs(sample.top - positionAtEnd) <= 1 && sample.height === heightAtEnd,
      );
      await wait();
      contentObserver.disconnect();
      const lastRect = last.getBoundingClientRect();
      const scrollRect = instance.scroll.getBoundingClientRect();
      const lastReached = lastRect.top >= 0 && lastRect.bottom <= innerHeight &&
        (kind === "document-scroll" || (lastRect.top >= scrollRect.top - 1 && lastRect.bottom <= scrollRect.bottom + 1));
      const hidesAtEnd = !root.querySelector(".a11y-additional-menu-hint");
      const endState = analyzeAdditionalMenuOverflow(root, instance.adapter);
      const point = { x: last.getBoundingClientRect().left + 30, y: last.getBoundingClientRect().top + 30 };
      const hit = document.elementFromPoint(point.x, point.y);
      const clickable = Boolean(hit?.closest(".menu-item") === last);
      last.click();
      const clicked = last.dataset.clicked === "true";
      if (kind === "document-scroll") window.scrollTo(0, 0);
      else instance.scroll.scrollTop = 0;
      (kind === "document-scroll" ? window : instance.scroll).dispatchEvent(new Event("scroll", { bubbles: true }));
      const returnsAfterScrollUp = await hintVisible() || root.dataset.a11yScrollGuidance === "no-safe-space";
      await wait();
      instance.sdk.endSession();
      const clearsOnSessionEnd = !root.querySelector(".a11y-additional-menu-hint");
      instance.sdk.destroy();
      const clearsOnDestroy = !root.querySelector(".a11y-additional-menu-hint");
      const dockRect = instance.dock.getBoundingClientRect().toJSON();
      const controlsRect = instance.footer.getBoundingClientRect().toJSON();
      instance.dock.remove();
      return { startsVisible, noSafeSpaceAtStart, standardCopy, hidesAtEnd, returnsAfterScrollUp, lastReached, clickable, clicked, initialNoOverlap, hintPointerEventsNone, hintRect: hintRect?.toJSON() ?? null, dockRect, controlsRect, scrollStable, contentStyleMutations: { count: contentStyleMutations, unchanged: contentStyleMutations === 0 }, endSamples, clearsOnSessionEnd, clearsOnDestroy };
    }
    try {
      result.fixtureA = await checkScrollable("own-scroll", 9);
      result.fixtureB = await checkScrollable("document-scroll", 15);
      const fit = mount("fit", 4);
      result.fixtureC = { startsHidden: !(await hintVisible()) };
      fit.sdk.destroy();
      const blocked = mount("unreachable", 9);
      const blockedState = blocked.sdk.inspectLayout();
      result.fixtureD = {
        hintHidden: !(await hintVisible()),
        diagnostic: blockedState.some((issue) => issue.issueType === "menu-overflow-unreachable"),
      };
      blocked.sdk.destroy();
      const enlarged = mount("fit", 10);
      const hiddenBefore = await hintVisible();
      enlarged.sdk.applyProfile({ ...DEFAULT_ACCESSIBILITY_PROFILE, textSize: "extraLarge", buttonSize: "large" });
      const appearsAfterProfile = await hintVisible();
      const enlargedState = analyzeAdditionalMenuOverflow(root, enlarged.adapter);
      window.dispatchEvent(new Event("resize"));
      await wait();
      result.fixtureE = { hiddenBefore, appearsAfterProfile, persistsAfterResize: await hintVisible(), safeSpaceDiagnostic: root.dataset.a11yScrollGuidance === "no-safe-space", hiddenItemsAfterProfile: enlargedState.hiddenCount };
      enlarged.sdk.endSession();
      document.querySelector("[data-a11y-qr-entry-dock]")?.remove();
      result.sessionReset = !root.querySelector(".a11y-additional-menu-hint");
      root.replaceChildren();
      root.className = "kiosk";
      root.replaceChildren();
      root.className = "kiosk";
      const scroll = document.createElement("div");
      Object.assign(scroll.style, { height: "500px", overflowY: "auto", marginTop: "100px" });
      const spacer = document.createElement("div");
      spacer.style.height = "720px";
      const pay = Object.assign(document.createElement("button"), { id: "pay", textContent: "결제하기" });
      pay.style.cssText = "height:50px";
      scroll.append(spacer, pay);
      root.append(scroll);
      const primarySdk = createAccessibilitySdk({ root, adapter: {
        getSnapshot: () => ({ screenId: "payment" }),
        getActions: () => [{ id: "pay", name: "결제하기", element: pay, enabled: true, primary: true }],
        getTextTargets: () => [],
        getLayoutRegions: () => ({
          scrollArea: scroll,
          primaryActions: [{ element: pay, message: "아래에 결제하기 버튼이 있습니다. 화면을 위로 밀어보세요." }],
        }),
      } });
      result.primaryButton = { beginsGuided: await hintVisible(), correctMessage: root.querySelector(".a11y-additional-menu-copy")?.textContent === "아래에도 버튼이 있어요" };
      scroll.scrollTop = scroll.scrollHeight;
      scroll.dispatchEvent(new Event("scroll", { bubbles: true }));
      result.primaryButton.reachableButtonHitTest = document.elementFromPoint(pay.getBoundingClientRect().left + 10, pay.getBoundingClientRect().top + 10) === pay;
      result.primaryButton.hidesWhenVisible = !(await hintVisible());
      primarySdk.destroy();
      root.replaceChildren();
      root.className = "kiosk";
      const rich = document.createElement("button");
      rich.style.cssText = "display:grid;grid-template-columns:48px 1fr;gap:8px;width:min(280px,90vw);padding:12px;text-align:left";
      const image = Object.assign(document.createElement("span"), { textContent: "☕", ariaHidden: "true" });
      const details = document.createElement("span");
      details.style.cssText = "display:flex;flex-direction:column;min-width:0";
      const title = Object.assign(document.createElement("span"), { textContent: "시나몬 크림 라테 / Cinnamon Cream Latte" });
      const price = Object.assign(document.createElement("span"), { textContent: "5,500원" });
      const description = Object.assign(document.createElement("span"), { textContent: "향긋한 시나몬과 부드러운 크림" });
      details.append(title, price, description); rich.append(image, details);
      const selectionLabel = Object.assign(document.createElement("label"), { textContent: "이전 주소 표시" });
      const toggle = document.createElement("button");
      toggle.setAttribute("role", "switch"); toggle.setAttribute("aria-checked", "true");
      toggle.setAttribute("aria-label", "이전 주소 표시"); toggle.style.cssText = "width:44px;height:24px";
      const fee = Object.assign(document.createElement("button"), { textContent: "수수료 면제 확인" });
      root.append(rich, selectionLabel, toggle, fee);
      const richAdapter = {
        getSnapshot: () => ({ screenId: "rich-form" }),
        getActions: () => [
          { id: "rich-card", name: "시나몬 크림 라테", element: rich, enabled: true },
          { id: "address-switch", name: "이전 주소 표시", element: toggle, enabled: true },
          { id: "fee-exemption", name: "수수료 면제 확인", element: fee, enabled: true },
        ],
        getTextTargets: () => [title, price, description, selectionLabel].map((element, i) => ({ id: `rich.text.${i}`, element })),
        getLayoutRegions: () => ({}),
      };
      const richSdk = createAccessibilitySdk({ root, adapter: richAdapter });
      const beforeText = parseFloat(getComputedStyle(description).fontSize);
      const beforeControl = toggle.getBoundingClientRect().height;
      richSdk.applyProfile({ ...DEFAULT_ACCESSIBILITY_PROFILE, textSize: "extraLarge", buttonSize: "large" });
      await wait();
      const afterText = parseFloat(getComputedStyle(description).fontSize);
      const afterControl = toggle.getBoundingClientRect().height;
      const richRect = rich.getBoundingClientRect();
      result.composite = {
        textEnlarged: afterText > beforeText,
        controlEnlarged: afterControl > beforeControl,
        wrapAvoidsAnywhere: getComputedStyle(title).overflowWrap !== "anywhere",
        contentPresent: ["Cinnamon Cream Latte", "5,500원", "향긋한 시나몬"].every((value) => root.innerText.includes(value)),
        noHorizontalOverflow: document.documentElement.scrollWidth <= innerWidth,
        clickable: document.elementFromPoint(richRect.left + 20, richRect.top + 20)?.closest("button") === rich,
      };
      result.smallControls = {
        descriptionEnlarged: afterText > beforeText,
        switchNamePreserved: toggle.getAttribute("aria-label") === "이전 주소 표시" && selectionLabel.textContent === "이전 주소 표시",
        switchStatePreserved: toggle.getAttribute("aria-checked") === "true",
        hitTest: document.elementFromPoint(toggle.getBoundingClientRect().left + 10, toggle.getBoundingClientRect().top + 10) === toggle,
        allVisibleNoHint: !(await hintVisible()),
      };
      richSdk.destroy();
      root.replaceChildren();
      root.className = "kiosk";
      const autoText = Object.assign(document.createElement("p"), { textContent: "자동 검색 텍스트" });
      autoText.style.fontSize = "12px";
      const categoryRail = document.createElement("nav");
      Object.assign(categoryRail.style, { width: "190px", overflowX: "auto", whiteSpace: "nowrap" });
      categoryRail.id = "fixture-categories";
      categoryRail.append(...Array.from({ length: 4 }, (_, index) => {
        const item = document.createElement("span");
        item.textContent = `분류 ${index + 1}`;
        item.style.cssText = "display:inline-block;width:120px";
        return item;
      }));
      const previousCategory = Object.assign(document.createElement("button"), { textContent: "〈" });
      previousCategory.setAttribute("aria-label", "Previous items");
      previousCategory.setAttribute("aria-controls", categoryRail.id);
      previousCategory.disabled = true;
      const nextCategory = Object.assign(document.createElement("button"), { textContent: "〉" });
      nextCategory.setAttribute("aria-label", "Next items");
      nextCategory.setAttribute("aria-controls", categoryRail.id);
      let nextWasClicked = false;
      nextCategory.addEventListener("click", () => {
        nextWasClicked = true;
        categoryRail.scrollLeft = categoryRail.scrollWidth;
        categoryRail.dispatchEvent(new Event("scroll", { bubbles: true }));
        setTimeout(() => { previousCategory.disabled = false; }, 0);
      });
      previousCategory.addEventListener("click", () => {
        categoryRail.scrollLeft = 0;
        categoryRail.dispatchEvent(new Event("scroll", { bubbles: true }));
        setTimeout(() => { previousCategory.disabled = true; }, 0);
      });
      root.append(autoText, previousCategory, categoryRail, nextCategory);
      const autoSdk = createAccessibilitySdk({ root, adapter: {
        getSnapshot: () => ({ screenId: "auto-text" }),
        getActions: () => [],
        getTextTargets: () => [],
        getLayoutRegions: () => ({}),
      } });
      const originalAutoFont = parseFloat(getComputedStyle(autoText).fontSize);
      autoSdk.applyProfile({ ...DEFAULT_ACCESSIBILITY_PROFILE, textSize: "extraLarge" });
      const discoveredAutoFont = parseFloat(getComputedStyle(autoText).fontSize);
      const beginsHighlighted = nextCategory.classList.contains("a11y-next-item-emphasis");
      const neverAutoClicked = !nextWasClicked;
      const reducedMode = matchMedia("(prefers-reduced-motion: reduce)").matches;
      const animationName = getComputedStyle(nextCategory).animationName;
      const beforeAnimationBox = nextCategory.getBoundingClientRect();
      await wait();
      const duringAnimationBox = nextCategory.getBoundingClientRect();
      const geometryStable = ["width", "height", "left", "top"].every((key) =>
        Math.abs(beforeAnimationBox[key] - duringAnimationBox[key]) < 0.1,
      );
      nextCategory.click();
      await wait();
      const rightClickStops = !nextCategory.classList.contains("a11y-next-item-emphasis");
      const leftStartsAfterRight = previousCategory.classList.contains("a11y-next-item-emphasis");
      const notBothAtOnce = !(previousCategory.classList.contains("a11y-next-item-emphasis") && nextCategory.classList.contains("a11y-next-item-emphasis"));
      previousCategory.click();
      const leftClickStops = !previousCategory.classList.contains("a11y-next-item-emphasis");
      categoryRail.scrollLeft = 0;
      categoryRail.dispatchEvent(new Event("scroll", { bubbles: true }));
      await wait();
      const rightDoesNotRepeat = !nextCategory.classList.contains("a11y-next-item-emphasis");
      autoSdk.endSession();
      const clearedAtSessionEnd = !nextCategory.classList.contains("a11y-next-item-emphasis");
      result.automaticTargets = {
        fontEnlarged: discoveredAutoFont > originalAutoFont,
        highlightsRealNext: beginsHighlighted,
        rightClickStops,
        leftStartsAfterRight,
        leftClickStops,
        rightDoesNotRepeat,
        notBothAtOnce,
        animationNoLayout: reducedMode ? animationName === "none" : animationName.includes("a11y-next-soft-pulse"),
        geometryStable,
        clearsAtEnd: clearedAtSessionEnd && !previousCategory.classList.contains("a11y-next-item-emphasis"),
        neverAutoClicks: neverAutoClicked,
        noHorizontalScrollHint: !(await hintVisible()),
      };
      if (innerWidth === 320) {
        autoSdk.applyProfile(DEFAULT_ACCESSIBILITY_PROFILE);
        const timerStarted = nextCategory.classList.contains("a11y-next-item-emphasis");
        await new Promise((resolve) => setTimeout(resolve, 5100));
        result.automaticTargets.timerEnds = timerStarted && !nextCategory.classList.contains("a11y-next-item-emphasis");
      } else if (matchMedia("(prefers-reduced-motion: reduce)").matches) {
        autoSdk.applyProfile(DEFAULT_ACCESSIBILITY_PROFILE);
        const staticEmphasis = nextCategory.classList.contains("a11y-next-item-emphasis") &&
          getComputedStyle(nextCategory).animationName === "none";
        await new Promise((resolve) => setTimeout(resolve, 1800));
        result.automaticTargets.reducedMotion = staticEmphasis &&
          !nextCategory.classList.contains("a11y-next-item-emphasis");
        result.automaticTargets.timerEnds = result.automaticTargets.reducedMotion;
      } else {
        result.automaticTargets.timerEnds = true;
        result.automaticTargets.reducedMotion = true;
      }
      autoSdk.destroy();
      root.replaceChildren();
      const newHeader = document.createElement("header");
      newHeader.className = "fixture-header";
      const replacedScroll = document.createElement("div");
      replacedScroll.className = "fixture-scroll";
      const replacedItems = Array.from({ length: 9 }, (_, i) => Object.assign(document.createElement("button"), { className: "menu-item", textContent: `새 화면 ${i + 1}` }));
      replacedScroll.append(...replacedItems);
      root.className = "kiosk";
      root.append(newHeader, replacedScroll);
      await wait();
      result.newScreenReanalyzed = await hintVisible() ||
        root.dataset.a11yScrollGuidance === "no-safe-space" ||
        analyzeAdditionalMenuOverflow(root, enlarged.adapter).hasMoreBelow;
      enlarged.sdk.destroy();
      const guidancePassed = (item) => item.startsVisible && !item.noSafeSpaceAtStart &&
        item.standardCopy && item.hidesAtEnd && item.returnsAfterScrollUp && item.lastReached &&
        item.clickable && item.clicked && item.initialNoOverlap && item.hintPointerEventsNone &&
        item.scrollStable && item.contentStyleMutations.unchanged && item.clearsOnSessionEnd && item.clearsOnDestroy;
      result.passed = guidancePassed(result.fixtureA) && guidancePassed(result.fixtureB) &&
        result.fixtureC.startsHidden && result.fixtureD.hintHidden && result.fixtureD.diagnostic &&
        result.fixtureE.hiddenBefore && (result.fixtureE.appearsAfterProfile || result.fixtureE.safeSpaceDiagnostic) &&
        (result.fixtureE.persistsAfterResize || result.fixtureE.safeSpaceDiagnostic) &&
        result.sessionReset && result.newScreenReanalyzed &&
        result.primaryButton.beginsGuided && result.primaryButton.correctMessage &&
        result.primaryButton.reachableButtonHitTest && result.primaryButton.hidesWhenVisible &&
        Object.values(result.automaticTargets).every(Boolean) &&
        Object.values(result.composite).every(Boolean) && Object.values(result.smallControls).every(Boolean);
    } catch (error) {
      result.error = String(error?.stack || error);
      result.passed = false;
    }
    document.querySelector("#fixture-result").textContent = JSON.stringify(result);
    document.body.dataset.testStatus = result.passed ? "passed" : "failed";
  </script>
</body>
</html>

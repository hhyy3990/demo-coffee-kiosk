<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" href="data:," />
    <title>SDK standalone consumer smoke test</title>
  </head>
  <body>
    <div id="kiosk-root" class="kiosk">
      <main class="content" data-a11y-slot="scroll-content">
        <p class="eyebrow">INDEPENDENT HOST</p>
        <h1 data-a11y-text data-a11y-id="host.review.heading">확인 단계</h1>
        <p data-a11y-text data-a11y-id="host.review.description">
          이 화면은 카페 코드 없이 SDK 패키지를 불러옵니다.
        </p>
        <p data-a11y-detail>개인 데이터 없이 샘플 상태만 사용합니다.</p>
        <label for="test-pin">확인 번호</label>
        <input id="test-pin" value="12" inputmode="numeric" />
        <div class="keypad" aria-label="숫자 키패드">
          <button type="button">1</button><button type="button">2</button><button type="button">3</button>
          <button type="button">4</button><button type="button">5</button><button type="button">6</button>
          <button type="button">7</button><button type="button">8</button><button type="button">9</button>
          <button type="button">지움</button><button type="button">0</button><button type="button">확인</button>
        </div>
        <output id="host-state" aria-live="polite">업무 작업 0회</output>
      </main>
      <footer class="bottom-controls" data-a11y-slot="bottom-controls">
        <button
          id="host-continue"
          data-a11y-action-id="host.review.continue"
          type="button"
        >
          계속
        </button>
      </footer>
      <output id="sdk-status" class="sdk-status" aria-live="polite">초기화 중</output>
    </div>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>

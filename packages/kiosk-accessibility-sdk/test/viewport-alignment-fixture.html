<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Generic bottom viewport alignment fixture</title>
  <link rel="stylesheet" href="/packages/kiosk-accessibility-sdk/dist/styles.css">
  <style>
    * { box-sizing: border-box; }
    html, body { width: 100%; height: 100%; margin: 0; font: 16px/1.4 sans-serif; }
    #host { width: 100%; height: 100%; }
    .screen-shell { width: 100%; min-height: 780px; }
    .shell { width: 100%; height: 100%; min-height: 780px; display: grid; place-items: center; }
    .stage {
      width: 100%; height: 100%; min-height: 100vh; overflow: auto;
      display: grid; place-items: center; scroll-behavior: auto !important;
    }
    .content { width: 100%; min-height: 780px; padding: 36px 24px 24px; }
    .content h1 { margin: 0 0 16px; font-size: 22px; line-height: 1.4; }
    .items { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px; }
    .items button { min-height: 54px; font: inherit; }
    .footer {
      position: fixed; z-index: 12; inset-inline: 0; bottom: 0;
      min-height: 72px; display: flex; align-items: center; justify-content: center;
      background: #292929; color: white; display: none;
    }
    [data-a11y-qr-entry-dock] {
      position: fixed; z-index: 14; inset-inline: 0; bottom: 72px;
      min-height: 54px; display: grid; place-items: center;
      background: #ddd; display: none;
    }
    .centered .stage { display: flex; flex-direction: column; justify-content: center; align-items: center; }
    .centered .content { display: flex; flex-direction: column; justify-content: center; align-items: center; }
    .centered .items { width: 100%; }
    .long .screen-shell { min-height: 1100px; }
    .inner-scroll .stage { height: 100vh; min-height: 0; }
    .inner-scroll .screen-shell { min-height: 1100px; }
    .center-shell .stage { display: flex; flex-direction: column; justify-content: center; align-items: stretch; }
    .safe-contract .stage { justify-content: flex-start; }
    .with-controls .footer, .dock-controls .footer { display: flex; }
    .dock-controls [data-a11y-qr-entry-dock] { display: grid; }
  </style>
</head>
<body>
  <main id="host" class="shell">
    <section id="stage" class="stage" data-a11y-slot="scroll-content">
      <div class="screen-shell">
        <div class="content">
          <h1 id="first-heading">첫 업무 제목: 내용을 확인해 주세요</h1>
          <p>공통 SDK 독립 검증을 위한 일반 키오스크 콘텐츠입니다.</p>
          <div class="items" id="items"></div>
        </div>
      </div>
    </section>
    <footer class="footer" data-a11y-slot="bottom-controls">하단 업무 버튼</footer>
    <aside data-a11y-qr-entry-dock>QR 설정 도크</aside>
  </main>
  <script type="module">
    import { createAccessibilitySdk, DEFAULT_ACCESSIBILITY_PROFILE } from
      "/packages/kiosk-accessibility-sdk/dist/index.js";

    const params = new URLSearchParams(location.search);
    const layout = params.get("layout") || "min-height";
    const percentParam = params.get("percent") || "80";
    const percent = percentParam === "none" ? null : Number(percentParam);
    const layoutClasses = {
      "min-height": [],
      "centered": ["centered"],
      "centered-min-height": ["center-shell", "with-controls"],
      "centered-long": ["centered", "long"],
      "dock-controls": ["centered", "long", "dock-controls"],
      "inner-scroll": ["inner-scroll"],
      "with-controls": ["with-controls"],
      "safe-centered": ["center-shell", "with-controls", "safe-contract"],
    }[layout] || [];
    document.body.classList.add(...layoutClasses);
    const items = document.querySelector("#items");
    const itemCount = layoutClasses.includes("long") || layout === "inner-scroll" ? 18 : 8;
    for (let index = 1; index <= itemCount; index += 1) {
      const button = document.createElement("button");
      button.textContent = `업무 항목 ${index}`;
      button.id = index === itemCount ? "last-action" : `action-${index}`;
      button.addEventListener("click", () => { window.lastActionClicked = true; });
      items.append(button);
    }
    const root = document.querySelector("#host");
    const stage = document.querySelector("#stage");
    if (params.get("diagnostic") === "overflow-anchor-none") {
      stage.style.setProperty("overflow-anchor", "none", "important");
    }
    if (params.get("diagnostic") === "position-static") {
      stage.style.setProperty("position", "static", "important");
    }
    const inputStats = { scrollEvents: 0, wheelEvents: 0, touchStarts: 0, touchMoves: 0, observations: [] };
    const rootScrollListeners = [];
    const rootAddEventListener = root.addEventListener;
    root.addEventListener = function (type, listener, options) {
      if (type === "scroll") rootScrollListeners.push({
        listener, capture: options === true || options?.capture === true,
        stack: new Error().stack?.split("\n").slice(1, 6),
      });
      return rootAddEventListener.call(this, type, listener, options);
    };
    const probe = {
      observerCallbacks: [],
      scrollWrites: [],
      scrollMethods: [],
      input: { wheel: 0, touchstart: 0, touchmove: 0, touchend: 0, pointerdown: 0, pointerup: 0 },
      lastInputAt: null,
    };
    for (const eventName of Object.keys(probe.input)) {
      window.addEventListener(eventName, () => {
        probe.input[eventName] += 1;
        probe.lastInputAt = performance.now();
      }, { capture: true, passive: true });
    }
    for (const name of ["ResizeObserver", "MutationObserver"]) {
      const NativeObserver = window[name];
      if (!NativeObserver) continue;
      window[name] = class extends NativeObserver {
        constructor(callback) {
          super((...args) => {
            const nodes = (list) => [...list].map((node) => node instanceof Element
              ? `${node.tagName.toLowerCase()}#${node.id}.${String(node.className || "").trim().replace(/\s+/g, ".")}`
              : node.nodeName);
            probe.observerCallbacks.push({
              type: name, at: performance.now(),
              records: name === "MutationObserver" ? (args[0] || []).map((record) => ({
                kind: record.type,
                target: record.target instanceof Element
                  ? `${record.target.tagName.toLowerCase()}#${record.target.id}.${String(record.target.className || "").trim().replace(/\s+/g, ".")}`
                  : record.target.nodeName,
                attribute: record.attributeName,
                added: nodes(record.addedNodes || []),
                removed: nodes(record.removedNodes || []),
              })) : undefined,
            });
            callback(...args);
          });
        }
      };
    }
    for (let prototype = Object.getPrototypeOf(stage); prototype; prototype = Object.getPrototypeOf(prototype)) {
      const descriptor = Object.getOwnPropertyDescriptor(prototype, "scrollTop");
      if (!descriptor?.set || !descriptor.configurable) continue;
      Object.defineProperty(prototype, "scrollTop", {
        ...descriptor,
        set(value) {
          if (this === stage) probe.scrollWrites.push({
            at: performance.now(), value, stack: new Error().stack?.split("\n").slice(1, 5),
          });
          descriptor.set.call(this, value);
        },
      });
      break;
    }
    for (const [object, methodName, appliesToStage] of [
      [Element.prototype, "scrollTo", (target) => target === stage],
      [Element.prototype, "scrollIntoView", (target) => target === stage || stage.contains(target)],
      [window, "scrollTo", () => true],
      [window, "scroll", () => true],
    ]) {
      const original = object[methodName];
      if (typeof original !== "function") continue;
      object[methodName] = function (...args) {
        if (appliesToStage(this)) probe.scrollMethods.push({
          method: methodName, at: performance.now(), args: args.map((arg) =>
            typeof arg === "object" && arg !== null ? { ...arg } : arg),
          stack: new Error().stack?.split("\n").slice(1, 5),
        });
        return original.apply(this, args);
      };
    }
    const observeScroll = () => {
      inputStats.scrollEvents += 1;
      inputStats.observations.push({
        scrollTop: stage.scrollTop,
        scrollHeight: stage.scrollHeight,
        clientHeight: stage.clientHeight,
        top: stage.getBoundingClientRect().top,
        height: stage.getBoundingClientRect().height,
      });
    };
    stage.addEventListener("scroll", observeScroll, { passive: true });
    stage.addEventListener("wheel", () => { inputStats.wheelEvents += 1; }, { passive: true });
    stage.addEventListener("touchstart", () => { inputStats.touchStarts += 1; }, { passive: true });
    stage.addEventListener("touchmove", () => { inputStats.touchMoves += 1; }, { passive: true });
    const adapter = {
      getSnapshot: () => ({ screenId: "fixture.main" }),
      getActions: () => [...items.querySelectorAll("button")].map((element) => ({
        id: element.id, name: element.textContent || element.id, element, enabled: true,
      })),
      getTextTargets: () => [{ id: "fixture.heading", element: document.querySelector("#first-heading") }],
      getLayoutRegions: () => ({
        scrollArea: stage,
        bottomControls: [document.querySelector(".footer")],
      }),
    };
    const measure = () => {
      const heading = document.querySelector("#first-heading");
      const headingRect = heading.getBoundingClientRect();
      const stageRect = stage.getBoundingClientRect();
      const point = {
        x: Math.min(innerWidth - 1, Math.max(0, (headingRect.left + headingRect.right) / 2)),
        y: Math.min(innerHeight - 1, Math.max(0, (headingRect.top + headingRect.bottom) / 2)),
      };
      const hit = document.elementFromPoint(point.x, point.y);
      return {
        stage: stageRect.toJSON(),
        heading: headingRect.toJSON(),
        headingFullyVisible: headingRect.top >= stageRect.top - 1 && headingRect.bottom <= stageRect.bottom + 1,
        headingHit: hit === heading || heading.contains(hit),
        headingHitTag: hit?.tagName ?? null,
        scrollTop: stage.scrollTop,
        scrollHeight: stage.scrollHeight,
        clientHeight: stage.clientHeight,
        contentMinHeight: getComputedStyle(document.querySelector(".content")).minHeight,
        stageDisplay: getComputedStyle(stage).display,
        alignItems: getComputedStyle(stage).alignItems,
        alignContent: getComputedStyle(stage).alignContent,
        justifyContent: getComputedStyle(stage).justifyContent,
      };
    };
    const before = measure();
    const sdk = createAccessibilitySdk({ root, adapter });
    delete root.addEventListener;
    const baseProfile = { ...DEFAULT_ACCESSIBILITY_PROFILE };
    sdk.applyProfile({
      ...baseProfile,
      textSize: params.get("large") === "true" ? "extraLarge" : "standard",
      buttonSize: params.get("large") === "true" ? "large" : "standard",
      contrast: params.get("large") === "true" ? "high" : "standard",
      viewportMode: percent === null ? null : { mode: "bottom", heightPercent: percent },
    });
    const applied = percent === null
      ? sdk.profile.viewportMode === null
      : sdk.profile.viewportMode?.heightPercent === percent &&
        stage.classList.contains("a11y-bottom-viewport-scroll-area");

    const topState = measure();
    window.fixtureReady = {
      layout, viewport: `${innerWidth}x${innerHeight}`, percent,
      large: params.get("large") === "true", applied, before, top: topState,
    };
    window.readLastAction = () => {
      const last = document.querySelector("#last-action");
      const rect = last.getBoundingClientRect();
      const hit = document.elementFromPoint((rect.left + rect.right) / 2, (rect.top + rect.bottom) / 2);
      const footer = document.querySelector(".footer");
      const dock = document.querySelector("[data-a11y-qr-entry-dock]");
      const footerStyle = getComputedStyle(footer);
      const dockStyle = getComputedStyle(dock);
      const safeBottom = Math.min(
        stage.getBoundingClientRect().bottom,
        footerStyle.display === "none" ? innerHeight : footer.getBoundingClientRect().top,
        dockStyle.display === "none" ? innerHeight : dock.getBoundingClientRect().top,
      );
      const lastState = {
        testId: `${layout}_${innerWidth}x${innerHeight}_large-${params.get("large") === "true"}_viewport-${percent}`,
        scrollOwner: { id: stage.id, tag: stage.tagName, isDocumentScroller: stage === document.scrollingElement },
        documentScrollTop: document.scrollingElement?.scrollTop ?? null,
        scrollTop: stage.scrollTop,
        scrollHeight: stage.scrollHeight,
        clientHeight: stage.clientHeight,
        maxScroll: stage.scrollHeight - stage.clientHeight,
        overflowY: getComputedStyle(stage).overflowY,
        pointerEvents: getComputedStyle(stage).pointerEvents,
        touchAction: getComputedStyle(stage).touchAction,
        scrollBehavior: getComputedStyle(stage).scrollBehavior,
        inputStats: structuredClone(inputStats),
        rect: rect.toJSON(),
        screenRect: rect.toJSON(),
        hitTag: hit?.tagName ?? null,
        hitId: hit?.id ?? null,
        edgeHits: [
          [rect.left + 2, rect.top + 2],
          [rect.right - 2, rect.top + 2],
          [rect.left + 2, rect.bottom - 2],
          [rect.right - 2, rect.bottom - 2],
        ].map(([x, y]) => {
          const edgeHit = document.elementFromPoint(x, y);
          return { x, y, tag: edgeHit?.tagName ?? null, id: edgeHit?.id ?? null,
            isLast: edgeHit === last || last.contains(edgeHit) };
        }),
        footer: { display: footerStyle.display, position: footerStyle.position, rect: footer.getBoundingClientRect().toJSON() },
        dock: { display: dockStyle.display, position: dockStyle.position, rect: dock.getBoundingClientRect().toJSON() },
        visible: rect.top >= stage.getBoundingClientRect().top - 1 && rect.bottom <= safeBottom + 1,
        hit: hit === last || last.contains(hit),
      };
      return lastState;
    };
    window.waitForScrollQuiet = async () => {
      let previous = stage.scrollTop;
      let stable = 0;
      let waited = 0;
      while (stable < 3 && waited < 3000) {
        await new Promise((resolve) => setTimeout(resolve, 100));
        const current = stage.scrollTop;
        stable = current === previous ? stable + 1 : 0;
        previous = current;
        waited += 100;
      }
      return { waited, stable, scrollTop: stage.scrollTop };
    };
    window.forceMaximumScrollDiagnostic = async () => {
      const settled = await window.waitForScrollQuiet();
      stage.style.setProperty("scroll-behavior", "auto", "important");
      const assignedTop = stage.scrollHeight - stage.clientHeight;
      stage.scrollTop = assignedTop;
      const states = [{ delay: 0, assignedTop, immediateTop: stage.scrollTop, settled, ...window.readLastAction() }];
      for (const delay of [100, 500, 1000, 3000]) {
        await new Promise((resolve) => setTimeout(resolve, delay));
        states.push({ delay, ...window.readLastAction() });
      }
      return states;
    };
    window.captureScrollReturnTimeline = async () => {
      if (params.get("diagnostic") === "scroll-guidance-disabled") {
        for (const entry of rootScrollListeners) {
          root.removeEventListener("scroll", entry.listener, entry.capture);
        }
      }
      if (params.get("diagnostic") === "hint-removal-blocked") {
        const hint = document.querySelector(".a11y-additional-menu-hint");
        if (hint) hint.remove = () => { probe.hintRemovalBlocked = true; };
      }
      const snapshot = (label, elapsed = 0) => {
        const stageRect = stage.getBoundingClientRect();
        const heading = document.querySelector("#first-heading").getBoundingClientRect();
        const last = document.querySelector("#last-action").getBoundingClientRect();
        const style = getComputedStyle(stage);
        const maxScroll = Math.max(0, stage.scrollHeight - stage.clientHeight);
        return {
          label, elapsedMs: Number(elapsed.toFixed(2)), performanceNow: performance.now(),
          owner: stage.id, isDocumentScroller: stage === document.scrollingElement,
          documentScrollTop: document.scrollingElement?.scrollTop ?? null,
          scrollTop: stage.scrollTop, scrollHeight: stage.scrollHeight,
          clientHeight: stage.clientHeight, maxScroll,
          stageRect: stageRect.toJSON(), headingRect: heading.toJSON(), lastButtonRect: last.toJSON(),
          css: {
            overflowY: style.overflowY, scrollBehavior: style.scrollBehavior,
            scrollSnapType: style.scrollSnapType, overflowAnchor: style.overflowAnchor,
            pointerEvents: style.pointerEvents, touchAction: style.touchAction,
            position: style.position, transform: style.transform,
            viewportHeight: style.getPropertyValue("--a11y-bottom-viewport-height"),
            viewportBottomInset: style.getPropertyValue("--a11y-bottom-viewport-bottom-inset"),
          },
          input: { ...probe.input, lastInputAt: probe.lastInputAt },
          observerCallbackCount: probe.observerCallbacks.length,
          scrollWriteCount: probe.scrollWrites.length,
          scrollMethodCount: probe.scrollMethods.length,
          hintRemovalBlocked: Boolean(probe.hintRemovalBlocked),
           hints: [document.querySelector(".a11y-additional-menu-hint"),
             ...root.querySelectorAll(".a11y-guide-toast, .a11y-guidance-slot")].filter(Boolean)
            .map((element) => ({
              className: element.className, text: element.textContent,
              rect: element.getBoundingClientRect().toJSON(),
            })),
        };
      };
      await window.waitForScrollQuiet();
      const before = snapshot("before");
      const start = performance.now();
      const max = Math.max(0, stage.scrollHeight - stage.clientHeight);
      stage.scrollTop = max;
      const immediate = snapshot("immediate", performance.now() - start);
      const nextFrame = new Promise((resolve) => requestAnimationFrame(() =>
        resolve(snapshot("next-animation-frame", performance.now() - start))));
      const times = [16, 50, 100, 250, 500, 1000, 3000];
      const timed = times.map((time) => new Promise((resolve) => setTimeout(() =>
        resolve(snapshot(`${time}ms`, performance.now() - start)), time)));
      return {
        before, immediate,
        later: await Promise.all([nextFrame, ...timed]),
        disabledRootScrollListeners: params.get("diagnostic") === "scroll-guidance-disabled"
          ? rootScrollListeners.map(({ capture, stack }) => ({ capture, stack }))
          : [],
        scrollWrites: [...probe.scrollWrites],
        scrollMethods: [...probe.scrollMethods],
        observerCallbacks: [...probe.observerCallbacks],
      };
    };
    window.destroyFixtureSdk = () => sdk.destroy();
  </script>
</body>
</html>

<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>SDK additional-menu browser fixtures</title>
  <link rel="stylesheet" href="/packages/kiosk-accessibility-sdk/dist/styles.css">
  <style>
    * { box-sizing: border-box; }
    html, body { margin: 0; min-height: 100%; font: 16px/1.4 sans-serif; }
    body { padding-bottom: 96px; }
    #fixture-root { position: relative; width: 100%; min-height: 100vh; }
    .fixture-header { height: 104px; padding: 12px; }
    .fixture-scroll { height: calc(100vh - 190px); overflow-y: auto; padding-bottom: 96px; }
    .fixture-list { display: grid; gap: 8px; }
    .menu-item { display: block; width: 100%; min-height: 82px; border: 1px solid #777; background: white; }
    .fixture-footer { position: fixed; z-index: 6; right: 0; bottom: 0; left: 0; height: 76px; padding: 20px; background: #ddd; }
    #fixture-root.document-scroll .fixture-scroll { height: auto; overflow: visible; padding-bottom: 0; }
    #fixture-root.document-scroll .fixture-list { padding-bottom: 100px; }
    #fixture-root.fit .fixture-scroll { height: 600px; }
    #fixture-root.fit .menu-item { min-height: 48px; }
    #fixture-root.fit.a11y-text-extra .menu-item { min-height: 160px; }
    #fixture-root.unreachable { position: fixed; top: 0; left: 0; width: 100%; height: 320px; min-height: 0; overflow: hidden; }
    #fixture-root.unreachable .fixture-scroll { height: 230px; overflow: hidden; }
    #fixture-root.unreachable .fixture-footer { height: 60px; }
  </style>
</head>
<body>
  <div id="fixture-root"></div>
  <pre id="fixture-result">pending</pre>
  <script type="module">
    import { analyzeAdditionalMenuOverflow, createAccessibilitySdk, DEFAULT_ACCESSIBILITY_PROFILE } from "/packages/kiosk-accessibility-sdk/dist/index.js";
    const root = document.querySelector("#fixture-root");
    const result = {};
    const wait = () => new Promise((resolve) => setTimeout(resolve, 100));
    function mount(kind, count, message) {
      root.replaceChildren();
      root.className = `kiosk ${kind}`;
      const header = document.createElement("header");
      header.className = "fixture-header";
      header.textContent = "메뉴 영역";
      const scroll = document.createElement("div");
      scroll.className = "fixture-scroll";
      const list = document.createElement("div");
      list.className = "fixture-list";
      for (let index = 0; index < count; index += 1) {
        const button = document.createElement("button");
        button.className = "menu-item";
        button.textContent = `메뉴 ${index + 1}`;
        button.dataset.index = String(index);
        button.addEventListener("click", () => { button.dataset.clicked = "true"; });
        list.append(button);
      }
      scroll.append(list);
      const footer = document.createElement("footer");
      footer.className = "fixture-footer";
      footer.dataset.a11ySlot = "bottom-controls";
      footer.textContent = "하단 조작부";
      root.append(header, scroll, footer);
      const adapter = {
        getSnapshot: () => ({ screenId: `fixture.${kind}` }),
        getActions: () => [...root.querySelectorAll(".menu-item")].map((element, index) => ({
          id: `menu.${index}`, name: element.textContent, element, enabled: true,
        })),
        getTextTargets: () => [],
        getLayoutRegions: () => ({
          scrollArea: scroll,
          bottomControls: [footer],
          menuItems: [...root.querySelectorAll(".menu-item")],
          ...(message ? { menuMessage: message } : {}),
        }),
      };
      return { scroll, footer, sdk: createAccessibilitySdk({ root, adapter }), adapter };
    }
    async function hintVisible() { await wait(); return Boolean(root.querySelector(".a11y-additional-menu-hint") && getComputedStyle(root.querySelector(".a11y-additional-menu-hint")).visibility !== "hidden"); }
    async function checkScrollable(kind, count) {
      const instance = mount(kind, count, kind === "document-scroll" ? "아래에도 증명서 메뉴가 있습니다. 화면을 위로 밀어보세요." : "");
      const startsVisible = await hintVisible();
      const hint = root.querySelector(".a11y-additional-menu-hint");
      const hintRect = hint?.getBoundingClientRect();
      const last = root.querySelector(".menu-item:last-child");
      const initialNoOverlap = Boolean(hintRect && [...root.querySelectorAll(".menu-item,.fixture-footer")].every((node) => {
        const r = node.getBoundingClientRect();
        return !(hintRect.left < r.right && hintRect.right > r.left && hintRect.top < r.bottom && hintRect.bottom > r.top);
      }));
      if (kind === "document-scroll") window.scrollTo(0, document.documentElement.scrollHeight);
      else instance.scroll.scrollTop = instance.scroll.scrollHeight;
      (kind === "document-scroll" ? window : instance.scroll).dispatchEvent(new Event("scroll", { bubbles: true }));
      await wait();
      await wait();
      const lastRect = last.getBoundingClientRect();
      const scrollRect = instance.scroll.getBoundingClientRect();
      const lastReached = lastRect.top >= scrollRect.top - 1 && lastRect.bottom <= scrollRect.bottom + 1;
      const hidesAtEnd = !root.querySelector(".a11y-additional-menu-hint");
      const endState = analyzeAdditionalMenuOverflow(root, instance.adapter);
      const point = { x: last.getBoundingClientRect().left + 30, y: last.getBoundingClientRect().top + 30 };
      const hit = document.elementFromPoint(point.x, point.y);
      const clickable = Boolean(hit?.closest(".menu-item") === last);
      last.click();
      const clicked = last.dataset.clicked === "true";
      if (kind === "document-scroll") window.scrollTo(0, 0);
      else instance.scroll.scrollTop = 0;
      (kind === "document-scroll" ? window : instance.scroll).dispatchEvent(new Event("scroll", { bubbles: true }));
      const returnsAfterScrollUp = await hintVisible();
      await wait();
      instance.sdk.endSession();
      const clearsOnSessionEnd = !root.querySelector(".a11y-additional-menu-hint");
      instance.sdk.destroy();
      const clearsOnDestroy = !root.querySelector(".a11y-additional-menu-hint");
      return { startsVisible, hidesAtEnd, returnsAfterScrollUp, lastReached, clickable, clicked, initialNoOverlap, clearsOnSessionEnd, clearsOnDestroy };
    }
    try {
      result.fixtureA = await checkScrollable("own-scroll", 9);
      result.fixtureB = await checkScrollable("document-scroll", 9);
      const fit = mount("fit", 4);
      result.fixtureC = { startsHidden: !(await hintVisible()) };
      fit.sdk.destroy();
      const blocked = mount("unreachable", 9);
      const blockedState = blocked.sdk.inspectLayout();
      result.fixtureD = {
        hintHidden: !(await hintVisible()),
        diagnostic: blockedState.some((issue) => issue.issueType === "menu-overflow-unreachable"),
      };
      blocked.sdk.destroy();
      const enlarged = mount("fit", 10);
      const hiddenBefore = await hintVisible();
      enlarged.sdk.applyProfile({ ...DEFAULT_ACCESSIBILITY_PROFILE, textSize: "extraLarge", buttonSize: "large" });
      const appearsAfterProfile = await hintVisible();
      const enlargedState = analyzeAdditionalMenuOverflow(root, enlarged.adapter);
      window.dispatchEvent(new Event("resize"));
      await wait();
      result.fixtureE = { hiddenBefore, appearsAfterProfile, persistsAfterResize: await hintVisible(), hiddenItemsAfterProfile: enlargedState.hiddenCount };
      enlarged.sdk.endSession();
      result.sessionReset = !root.querySelector(".a11y-additional-menu-hint");
      root.replaceChildren();
      const newHeader = document.createElement("header");
      newHeader.className = "fixture-header";
      const replacedScroll = document.createElement("div");
      replacedScroll.className = "fixture-scroll";
      const replacedItems = Array.from({ length: 9 }, (_, i) => Object.assign(document.createElement("button"), { className: "menu-item", textContent: `새 화면 ${i + 1}` }));
      replacedScroll.append(...replacedItems);
      root.className = "kiosk";
      root.append(newHeader, replacedScroll);
      await wait();
      result.newScreenReanalyzed = Boolean(root.querySelector(".a11y-additional-menu-hint"));
      enlarged.sdk.destroy();
      result.passed = ["fixtureA", "fixtureB"].every((key) => Object.values(result[key]).every(Boolean)) &&
        result.fixtureC.startsHidden && result.fixtureD.hintHidden && result.fixtureD.diagnostic &&
        !result.fixtureE.hiddenBefore && result.fixtureE.appearsAfterProfile && result.fixtureE.persistsAfterResize &&
        result.sessionReset && result.newScreenReanalyzed;
    } catch (error) {
      result.error = String(error?.stack || error);
      result.passed = false;
    }
    document.querySelector("#fixture-result").textContent = JSON.stringify(result);
    document.body.dataset.testStatus = result.passed ? "passed" : "failed";
  </script>
</body>
</html>

<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>SDK 0.4.1 browser layout verification</title>
  <link rel="stylesheet" href="/packages/kiosk-accessibility-sdk/dist/styles.css">
  <style>
    * { box-sizing: border-box; }
    body { margin: 0; padding: 12px; font-family: sans-serif; }
    .sample { width: min(100%, 990px); min-height: 250px; border: 1px solid #999; margin-bottom: 12px; }
    .menu-grid { display: grid; grid-template-columns: repeat(2, minmax(210px, 1fr)); gap: 4px; }
    .toolbar { display: flex; gap: 4px; }
    #structure-b .toolbar { position: relative; height: 48px; }
    #structure-b button { position: absolute; top: 0; left: 0; }
    .copy { width: 130px; height: 20px; overflow: hidden; white-space: nowrap; font-size: 16px; }
    button { height: 28px; padding: 2px 4px; font-size: 14px; }
    @media (min-width: 800px) {
      .copy { font-size: 20px; }
      button { height: 44px; font-size: 18px; }
    }
    #structure-c { position: relative; }
    #structure-c [data-a11y-slot="scroll-content"] {
      height: 100dvh;
      overflow-y: auto;
      padding-bottom: 0 !important;
    }
    #structure-c button { display: block; width: 100%; height: 48px; margin-bottom: 28px; }
    #structure-c [data-a11y-slot="bottom-controls"] {
      position: fixed;
      bottom: 0;
      height: 160px;
      background: #eee;
      z-index: 20;
    }
  </style>
</head>
<body>
  <div id="structure-a" class="sample">
    <h2 class="copy" data-a11y-text>메뉴를 선택해 주세요</h2>
    <div class="menu-grid">
      <button id="a-one">첫 번째 메뉴</button>
      <button id="a-two">두 번째 메뉴</button>
    </div>
  </div>
  <section id="structure-b" class="sample">
    <article><p class="copy" data-a11y-text>신청 내용을 확인해 주세요</p></article>
    <footer class="toolbar">
      <button id="b-back">이전</button>
      <button id="b-next">계속</button>
    </footer>
  </section>
  <section id="structure-c" class="sample kiosk">
    <div data-a11y-slot="scroll-content">
      <button>메뉴 1</button><button>메뉴 2</button><button>메뉴 3</button><button>메뉴 4</button>
      <button>메뉴 5</button><button>메뉴 6</button><button>메뉴 7</button><button id="last-menu">마지막 메뉴</button>
    </div>
    <footer data-a11y-slot="bottom-controls">하단 조작부</footer>
  </section>
  <pre id="result">pending</pre>
  <script type="module">
    import {
      createAccessibilitySdk,
      DEFAULT_ACCESSIBILITY_PROFILE,
    } from "/packages/kiosk-accessibility-sdk/dist/index.js";
    function verify(root, actions, grids) {
      const text = root.querySelector("[data-a11y-text]");
      const adapter = {
        getSnapshot: () => ({ screenId: root.id }),
        getActions: () => actions.map((element, index) => ({
          id: `${root.id}.action.${index}`,
          name: element.textContent || "Action",
          element,
          enabled: true,
        })),
        getTextTargets: () => [{ id: `${root.id}.text`, element: text }],
        getLayoutRegions: () => ({
          bottomControls: [],
          scrollArea: null,
          reflowContainers: [root],
          gridContainers: grids,
          actionGroups: [...root.querySelectorAll(".toolbar")],
        }),
      };
      const sdk = createAccessibilitySdk({ root, adapter });
      const before = {
        textFont: getComputedStyle(text).fontSize,
        buttonHeight: actions[0].getBoundingClientRect().height,
        gridColumns: grids.map((grid) => getComputedStyle(grid).gridTemplateColumns),
      };
      const profile = { ...DEFAULT_ACCESSIBILITY_PROFILE, textSize: "extraLarge", buttonSize: "large" };
      sdk.applyProfile(profile);
      const after = {
        textFont: getComputedStyle(text).fontSize,
        buttonHeight: actions[0].getBoundingClientRect().height,
        gridColumns: grids.map((grid) => getComputedStyle(grid).gridTemplateColumns),
      };
      sdk.applyProfile(profile);
      const repeated = {
        textFont: getComputedStyle(text).fontSize,
        buttonHeight: actions[0].getBoundingClientRect().height,
      };
      const corrections = sdk.getLastLayoutCorrections();
      const explicitCorrection = sdk.correctLayout();
      sdk.endSession();
      const restored = {
        textFont: getComputedStyle(text).fontSize,
        buttonHeight: actions[0].getBoundingClientRect().height,
      };
      sdk.applyProfile(profile);
      const beforeDestroy = {
        textFont: getComputedStyle(text).fontSize,
        buttonHeight: actions[0].getBoundingClientRect().height,
      };
      sdk.destroy();
      const destroyed = {
        textFont: getComputedStyle(text).fontSize,
        buttonHeight: actions[0].getBoundingClientRect().height,
      };
      return { before, after, repeated, restored, beforeDestroy, destroyed, corrections, explicitCorrection };
    }
    const result = {
      version: "0.4.1",
      structures: [
        verify(document.querySelector("#structure-a"), [...document.querySelectorAll("#structure-a button")], [
          document.querySelector("#structure-a .menu-grid"),
        ]),
        verify(document.querySelector("#structure-b"), [...document.querySelectorAll("#structure-b button")], []),
      ],
    };
    const [gridCase, overlapCase] = result.structures;
    const passed = result.version === "0.4.1" &&
      result.structures.every((sample) =>
        sample.before.textFont !== "" &&
        Number.parseFloat(sample.after.textFont) > Number.parseFloat(sample.before.textFont) &&
        sample.after.buttonHeight >= 48 &&
        sample.repeated.textFont === sample.after.textFont &&
        sample.repeated.buttonHeight === sample.after.buttonHeight &&
        sample.restored.textFont === sample.before.textFont &&
        sample.restored.buttonHeight === sample.before.buttonHeight &&
        sample.destroyed.textFont === sample.before.textFont &&
        sample.destroyed.buttonHeight === sample.before.buttonHeight
      ) &&
      gridCase.corrections.some((item) => item.strategy === "text-wrap" && item.outcome === "applied") &&
      (innerWidth >= 800
        ? !gridCase.corrections.some((item) => item.strategy === "reduce-grid-columns" && item.outcome === "failed")
        : gridCase.corrections.some((item) => item.strategy === "reduce-grid-columns" && item.outcome === "applied")) &&
      overlapCase.corrections.some((item) => item.strategy === "stack-action-group" &&
        (item.outcome === "reverted" || item.outcome === "not-needed"));
    document.querySelector("#result").textContent = JSON.stringify(result);
    document.body.dataset.testStatus = passed ? "passed" : "failed";
    const resizeRoot = document.querySelector("#structure-a");
    const resizeText = resizeRoot.querySelector("[data-a11y-text]");
    const resizeActions = [...resizeRoot.querySelectorAll("button")];
    const resizeSdk = createAccessibilitySdk({
      root: resizeRoot,
      adapter: {
        getSnapshot: () => ({ screenId: "resize" }),
        getActions: () => resizeActions.map((element, index) => ({ id: `resize.${index}`, name: "메뉴", element, enabled: true })),
        getTextTargets: () => [{ id: "resize.text", element: resizeText }],
        getLayoutRegions: () => ({ bottomControls: [], scrollArea: null, reflowContainers: [resizeRoot], gridContainers: [], actionGroups: [] }),
      },
    });
    resizeSdk.applyProfile({ ...DEFAULT_ACCESSIBILITY_PROFILE, textSize: "extraLarge", buttonSize: "large" });
    window.measureForResize = () => ({
      width: window.innerWidth,
      font: getComputedStyle(resizeText).fontSize,
      button: resizeActions[0].getBoundingClientRect().height,
    });
    window.endResizeSession = () => {
      resizeSdk.endSession();
      return window.measureForResize();
    };
    window.reapplyResizeProfile = () => resizeSdk.applyProfile({
      ...DEFAULT_ACCESSIBILITY_PROFILE,
      textSize: "extraLarge",
      buttonSize: "large",
    });
    document.querySelector("#structure-c").scrollIntoView({ block: "start" });
    const scrollRoot = document.querySelector("#structure-c");
    const scrollArea = scrollRoot.querySelector('[data-a11y-slot="scroll-content"]');
    const footer = scrollRoot.querySelector('[data-a11y-slot="bottom-controls"]');
    const lastMenu = document.querySelector("#last-menu");
    for (let index = 8; index < 80; index++) {
      const item = document.createElement("button");
      item.textContent = `메뉴 ${index + 1}`;
      scrollArea.insertBefore(item, lastMenu);
    }
    let clicked = 0;
    lastMenu.addEventListener("click", () => clicked++);
    scrollArea.scrollTop = scrollArea.scrollHeight;
    const beforeLastRect = lastMenu.getBoundingClientRect();
    const beforeFooterRect = footer.getBoundingClientRect();
    const beforeOverlap = beforeLastRect.bottom > beforeFooterRect.top;
    scrollArea.scrollTop = 0;
    const scrollSdk = createAccessibilitySdk({
      root: scrollRoot,
      adapter: {
        getSnapshot: () => ({ screenId: "scroll-test" }),
        getActions: () => [...scrollRoot.querySelectorAll("button")].map((element, index) => ({ id: `menu.${index}`, name: "메뉴", element, enabled: true })),
        getTextTargets: () => [],
        getLayoutRegions: () => ({
          bottomControls: [footer],
          scrollArea,
          viewportOverlays: [...scrollRoot.querySelectorAll(".fixture-modal")],
          reflowContainers: [],
          gridContainers: [],
          actionGroups: [],
        }),
      },
    });
    const scrollBefore = scrollSdk.inspectLayout();
    scrollSdk.applyProfile({ ...DEFAULT_ACCESSIBILITY_PROFILE, buttonSize: "large", bottomControls: true });
    const legacyBottomControlsDidNotOptIn = !scrollRoot.classList.contains("a11y-bottom-viewport-enabled");
    scrollArea.scrollTop = scrollArea.scrollHeight;
    const lastRect = lastMenu.getBoundingClientRect();
    const footerRect = footer.getBoundingClientRect();
    const hit = document.elementFromPoint((lastRect.left + lastRect.right) / 2, (lastRect.top + lastRect.bottom) / 2);
    const hitTargetsLastMenu = Boolean(hit && (hit === lastMenu || lastMenu.contains(hit)));
    if (hitTargetsLastMenu) lastMenu.click();
    window.scrollCorrectionResult = {
      correction: scrollSdk.getLastLayoutCorrections().find((item) => item.strategy === "reserve-scroll-space"),
      overlapBefore: scrollBefore.some((item) => item.issueType === "last-scroll-action-obscured"),
      overlapAfter: scrollSdk.inspectLayout().some((item) => item.issueType === "last-scroll-action-obscured"),
      beforeLastMenuBottom: beforeLastRect.bottom,
      beforeFooterTop: beforeFooterRect.top,
      beforeOverlap,
      lastMenuBottom: lastRect.bottom,
      footerTop: footerRect.top,
      hitTargetsLastMenu,
      clickCount: clicked,
    };
    window.scrollCorrectionResult.pass =
      window.scrollCorrectionResult.correction?.outcome === "applied" &&
      beforeOverlap &&
      !window.scrollCorrectionResult.overlapAfter &&
      lastRect.bottom <= footerRect.top + 1 &&
      hitTargetsLastMenu &&
      clicked === 1;
    scrollSdk.destroy();
    const viewportCases = [];
    const viewportSdk = createAccessibilitySdk({
      root: scrollRoot,
      adapter: {
        getSnapshot: () => ({ screenId: "bottom-viewport" }),
        getActions: () => [...scrollRoot.querySelectorAll("button")].map((element, index) => ({ id: `viewport.${index}`, name: "메뉴", element, enabled: true })),
        getTextTargets: () => [],
        getLayoutRegions: () => ({
          bottomControls: [footer],
          scrollArea,
          viewportOverlays: [...scrollRoot.querySelectorAll(".fixture-modal")],
          primaryActions: [...scrollRoot.querySelectorAll("button")].map((element) => ({ element })),
          reflowContainers: [],
          gridContainers: [],
          actionGroups: [],
        }),
      },
    });
    for (const heightPercent of [60, 70, 80]) {
      const beforeButtonHeight = lastMenu.getBoundingClientRect().height;
      const appliedProfile = viewportSdk.applyProfile({
        ...DEFAULT_ACCESSIBILITY_PROFILE,
        viewportMode: { mode: "bottom", heightPercent },
      });
      const applied = viewportSdk.profile.viewportMode?.heightPercent === heightPercent &&
        scrollRoot.classList.contains("a11y-bottom-viewport-enabled");
      scrollArea.scrollTop = scrollArea.scrollHeight;
      const areaRect = scrollArea.getBoundingClientRect();
      const footerRect = footer.getBoundingClientRect();
      const itemRect = lastMenu.getBoundingClientRect();
      const hit = document.elementFromPoint((itemRect.left + itemRect.right) / 2, (itemRect.top + itemRect.bottom) / 2);
      const clickable = Boolean(hit && (hit === lastMenu || lastMenu.contains(hit)));
      if (clickable) lastMenu.click();
      viewportCases.push({
        heightPercent,
        applied,
        top: areaRect.top,
        height: areaRect.height,
        expectedHeight: (innerHeight -
          Number.parseFloat(scrollArea.style.getPropertyValue("--a11y-bottom-viewport-bottom-inset"))) *
          heightPercent / 100,
        buttonHeightBefore: beforeButtonHeight,
        buttonHeightAfter: lastMenu.getBoundingClientRect().height,
        safeInset: scrollArea.style.getPropertyValue("--a11y-bottom-viewport-safe-inset"),
        scrollTop: scrollArea.scrollTop,
        scrollHeight: scrollArea.scrollHeight,
        clientHeight: scrollArea.clientHeight,
        computedPaddingBottom: getComputedStyle(scrollArea).paddingBottom,
        lastMenuBottom: itemRect.bottom,
        footerTop: footerRect.top,
        clickable,
      });
    }
    const invalidModeRejected = !viewportSdk.setViewportMode({ mode: "bottom", heightPercent: 90 });
    const originalWidth = scrollArea.getBoundingClientRect().width;
    scrollRoot.style.width = "80vw";
    window.dispatchEvent(new Event("resize"));
    const resizedWidth = scrollArea.getBoundingClientRect().width;
    scrollRoot.style.width = "";
    window.dispatchEvent(new Event("resize"));
    const restoredWidth = scrollArea.getBoundingClientRect().width;
    const reactivated = viewportSdk.setViewportMode({ mode: "bottom", heightPercent: 70 }) &&
      scrollArea.classList.contains("a11y-bottom-viewport-scroll-area");
    viewportSdk.endSession();
    const restored = !scrollArea.classList.contains("a11y-bottom-viewport-scroll-area") &&
      !scrollRoot.classList.contains("a11y-bottom-viewport-enabled");
    const viewportModePassed = viewportCases.every((item) =>
      item.applied &&
      Math.abs(item.height - item.expectedHeight) <= 2 &&
      item.buttonHeightAfter === item.buttonHeightBefore &&
      item.lastMenuBottom <= item.footerTop + 1 &&
      item.clickable &&
      Number.parseFloat(item.safeInset) > 0
    ) && restored;
    const documentRootSdk = createAccessibilitySdk({
      root: document.querySelector("#structure-a"),
      adapter: {
        getSnapshot: () => ({ screenId: "document-root" }),
        getActions: () => [],
        getTextTargets: () => [],
        getLayoutRegions: () => ({ bottomControls: [], scrollArea: null }),
      },
    });
    const documentRootApplied = documentRootSdk.setViewportMode({ mode: "bottom", heightPercent: 70 });
    const documentRootRect = document.querySelector("#structure-a").getBoundingClientRect();
    documentRootSdk.endSession();
    window.bottomViewportResult = {
      viewport: `${innerWidth}x${innerHeight}`,
      layoutFixturePassed: passed,
      layoutDetails: result.structures.map((sample) => ({
        before: sample.before,
        after: sample.after,
        repeated: sample.repeated,
        restored: sample.restored,
        destroyed: sample.destroyed,
        corrections: sample.corrections,
      })),
      scrollCorrectionPassed: window.scrollCorrectionResult.pass,
      legacyBottomControlsDidNotOptIn,
      invalidModeRejected,
      resizeWidths: { originalWidth, resizedWidth, restoredWidth },
      viewportCases,
      restored,
      documentRootApplied,
      documentRootHeight: documentRootRect.height,
      documentRootExpectedHeight: innerHeight * 0.7,
      pass: viewportModePassed && legacyBottomControlsDidNotOptIn &&
        invalidModeRejected && reactivated && resizedWidth < originalWidth &&
        Math.abs(restoredWidth - originalWidth) <= 2 &&
        documentRootApplied &&
        Math.abs(documentRootRect.height - innerHeight * 0.7) <= 2,
    };
    window.runModalScrollTests = async () => {
      viewportSdk.endSession();
      viewportSdk.destroy();
      const modalSdk = createAccessibilitySdk({
        root: scrollRoot,
        adapter: {
          getSnapshot: () => ({ screenId: "modal-scroll-test" }),
          getActions: () => [...scrollRoot.querySelectorAll("button")].map((element, index) => ({
            id: `modal.${index}`, name: element.textContent ?? "메뉴", element, enabled: true,
          })),
          getTextTargets: () => [],
          getLayoutRegions: () => ({
            bottomControls: [footer],
            scrollArea,
            primaryActions: [...scrollRoot.querySelectorAll("button")].map((element) => ({ element })),
            viewportOverlays: [...scrollRoot.querySelectorAll(".fixture-modal")],
            reflowContainers: [],
            gridContainers: [],
            actionGroups: [],
          }),
        },
      });
      modalSdk.applyProfile({ ...DEFAULT_ACCESSIBILITY_PROFILE, textSize: "extraLarge", buttonSize: "large", contrast: "high" });
      modalSdk.setViewportMode({ mode: "bottom", heightPercent: 70 });
      const guideStates = [];
      const maxScroll = () => scrollArea.scrollHeight - scrollArea.clientHeight;
      for (const [label, ratio] of [["top", 0], ["25%", 0.25], ["50%", 0.5], ["75%", 0.75], ["bottom", 1], ["bottom-10px", -1]]) {
        scrollArea.scrollTop = ratio < 0 ? Math.max(0, maxScroll() - 10) : maxScroll() * ratio;
        scrollArea.dispatchEvent(new Event("scroll", { bubbles: true }));
        await new Promise((resolve) => setTimeout(resolve, 80));
        const pill = [...document.querySelectorAll(".a11y-additional-menu-hint")].at(-1);
        const pillRect = pill?.getBoundingClientRect();
        const footerRect = footer.getBoundingClientRect();
        guideStates.push({
          label,
          scrollTop: scrollArea.scrollTop,
          maxScroll: maxScroll(),
          visible: Boolean(pill && pill.getAttribute("aria-hidden") !== "true" &&
            getComputedStyle(pill).visibility !== "hidden"),
          message: pill?.querySelector(".a11y-additional-menu-copy")?.textContent ?? null,
          pillRect: pillRect ? { top: pillRect.top, bottom: pillRect.bottom } : null,
          footerTop: footerRect.top,
          avoidsFooter: !pillRect || pillRect.bottom <= footerRect.top,
        });
      }
      await new Promise((resolve) => setTimeout(resolve, 1000));
      const results = [];
      for (const kind of ["qr", "notice"]) {
        const targetIndex = Math.min(30, Math.floor(scrollArea.querySelectorAll("button").length * 0.6));
        const trigger = scrollArea.querySelectorAll("button")[targetIndex];
        scrollArea.scrollTop += trigger.getBoundingClientRect().top -
          scrollArea.getBoundingClientRect().top - 24;
        await new Promise((resolve) => requestAnimationFrame(() => requestAnimationFrame(resolve)));
        const ownerSnapshot = () => ({
          scrollTop: scrollArea.scrollTop,
          scrollHeight: scrollArea.scrollHeight,
          clientHeight: scrollArea.clientHeight,
          maxScroll: scrollArea.scrollHeight - scrollArea.clientHeight,
          activeElement: document.activeElement?.tagName,
          activeClass: (document.activeElement instanceof HTMLElement) ? document.activeElement.className : "",
          position: getComputedStyle(scrollArea).position,
          overflowY: getComputedStyle(scrollArea).overflowY,
          overflowAnchor: getComputedStyle(scrollArea).overflowAnchor,
          scrollPaddingBottom: getComputedStyle(scrollArea).scrollPaddingBottom,
        });
        const before = ownerSnapshot();
        let focusEvents = 0;
        trigger.click();
        const overlay = document.createElement("div");
        overlay.className = "fixture-modal";
        Object.assign(overlay.style, {
          position: "fixed", inset: "0", zIndex: "10000",
          background: "rgba(0,0,0,.45)", overflow: "hidden",
          display: "grid", placeItems: "center",
        });
        overlay.setAttribute("role", "presentation");
        const dialog = document.createElement("section");
        dialog.setAttribute("role", "dialog");
        dialog.setAttribute("aria-modal", "true");
        dialog.tabIndex = -1;
        Object.assign(dialog.style, {
          width: "min(90vw, 420px)", maxHeight: "70dvh",
          overflow: kind === "qr" ? "auto" : "visible",
          background: "white", padding: "20px",
        });
        dialog.innerHTML = `<h2>${kind === "qr" ? "QR 설정" : "안내"}</h2><div style="height:${kind === "qr" ? "900px" : "40px"}"></div><button type="button">닫기</button>`;
        dialog.addEventListener("focus", () => focusEvents++);
        overlay.append(dialog);
        scrollRoot.append(overlay);
        const closeButton = dialog.querySelector("button");
        let closeButtonHitTest = false;
        closeButton.addEventListener("click", () => {
          overlay.remove();
          trigger.focus();
        });
        dialog.focus();
        dialog.scrollTop = Number.MAX_SAFE_INTEGER;
        dialog.dispatchEvent(new Event("scroll", { bubbles: true }));
        await new Promise((resolve) => requestAnimationFrame(() => requestAnimationFrame(resolve)));
        const closeRect = closeButton.getBoundingClientRect();
        const closeHit = document.elementFromPoint(closeRect.left + closeRect.width / 2, closeRect.top + closeRect.height / 2);
        closeButtonHitTest = closeHit === closeButton;
        const immediatelyAfterInsert = ownerSnapshot();
        const samples = [];
        for (const delay of [100, 500, 1000]) {
          await new Promise((resolve) => setTimeout(resolve, delay));
          samples.push({ delay, ...ownerSnapshot() });
        }
        const modalHint = [...document.querySelectorAll(".a11y-additional-menu-hint")].at(-1);
        const hintVisibleWithModal = Boolean(modalHint &&
          modalHint.getAttribute("aria-hidden") !== "true" &&
          getComputedStyle(modalHint).visibility !== "hidden");
        const modalHasScrollableContent = dialog.scrollHeight > dialog.clientHeight + 1;
        closeButton.click();
        await new Promise((resolve) => setTimeout(resolve, 1000));
        const afterClose = ownerSnapshot();
        results.push({
          kind,
          modalHasScrollableContent,
          before,
          immediatelyAfterInsert,
          samples,
          afterClose,
          focusEvents,
          focusMovedToDialog: immediatelyAfterInsert.activeElement === "SECTION",
          focusReturnedAfterClose: afterClose.activeElement === "BUTTON",
          hintVisibleWithModal,
          stableDuringOpen: [immediatelyAfterInsert, ...samples].every((sample) =>
            Math.abs(sample.scrollTop - before.scrollTop) <= 1
          ),
          stableAfterClose: Math.abs(afterClose.scrollTop - before.scrollTop) <= 1,
          closeButtonHitTest,
        });
      }
      modalSdk.endSession();
      modalSdk.destroy();
      return {
        results,
        guideStates,
        pass: guideStates.slice(0, 4).every((item) => item.visible && item.avoidsFooter) &&
          !guideStates[4].visible && guideStates[5].visible &&
          results.every((item) =>
            item.stableDuringOpen && item.stableAfterClose &&
            item.focusMovedToDialog && item.focusReturnedAfterClose &&
            item.closeButtonHitTest && !item.hintVisibleWithModal
          ),
      };
    };
    document.body.dataset.testStatus = passed && window.scrollCorrectionResult.pass && window.bottomViewportResult.pass ? "passed" : "failed";
  </script>
</body>
</html>
